openapi: 3.0.0
info:
  title: API Modul M11 - Goods Receipt Note (GRN)
  description: API untuk mencatat penerimaan barang dari supplier sesuai Panduan API Bersama v1.0
  version: 2.0.0
servers:
  - url: https://server-bersama/api/m11/v1
    description: Server Bersama Araya Business Hub
paths:
  /purchase-orders/{purchase_order_id}/receive:
    post:
      summary: Mencatat penerimaan barang
      description: Mencatat penerimaan barang dan mengirim event ke Modul M9
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: purchase_order_id
          required: true
          schema:
            type: integer
            example: 125
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - received_date
                - items
              properties:
                received_date:
                  type: string
                  format: date
                  example: "2026-10-24"
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        example: 31
                      qty_received:
                        type: integer
                        example: 50
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    purchase_order_id: 125
                    status: "diterima"
                    received_date: "2026-10-24"
        '400':
          description: Gagal akibat kuantitas melebihi pesanan
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  error:
                    code: "QUANTITY_EXCEEDED"
                    message: "Jumlah diterima melebihi pesanan"
                    fields: null
        '404':
          description: PO Tidak Ditemukan
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  error:
                    code: "PO_NOT_FOUND"
                    message: "Purchase order tidak ditemukan"
                    fields: null
        '409':
          description: PO Belum Disetujui
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  error:
                    code: "PO_NOT_APPROVED"
                    message: "PO belum disetujui, tidak bisa diproses"
                    fields: null
        '422':
          description: Isian tidak lolos validasi
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  error:
                    code: "INVALID_QUANTITY"
                    message: "Jumlah tidak valid"
                    fields:
                      qty_received: "Jumlah tidak boleh kosong atau nol"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT